<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビッグファイブツール — Arluna AI Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Noto+Sans+JP:wght@300;400;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080f0a;--bg2:#0d1a10;--bg3:#112216;
  --green:#2d7a4f;--green2:#3fa068;--green3:#1a4d30;
  --emerald:#50c878;--gold:#c9a96e;--gold2:#e8d5a3;
  --dim:#1a3020;--muted:#5a8068;--text:#ddeee4;--light:#f0faf4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;overflow-x:hidden;font-weight:300}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.03;pointer-events:none;z-index:0}

.blob{position:fixed;border-radius:50%;filter:blur(140px);opacity:.13;pointer-events:none;z-index:0;animation:blobDrift 22s ease-in-out infinite alternate}
.blob1{width:600px;height:500px;background:#2d7a4f;top:-150px;right:-150px;animation-duration:24s}
.blob2{width:400px;height:400px;background:#1a4d30;bottom:-100px;left:-100px;animation-duration:30s;animation-delay:-12s}
.blob3{width:280px;height:280px;background:#c9a96e;top:50%;left:40%;opacity:.05;animation-duration:18s;animation-delay:-6s}
@keyframes blobDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,20px) scale(1.05)}}

.v-line{position:fixed;left:36px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--green3) 30%,var(--green3) 70%,transparent);opacity:.4;z-index:0}
@media(max-width:600px){.v-line{display:none}}

/* Back link */
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:2px;color:#3a6a4a;text-decoration:none;padding:8px 16px 0;transition:color .2s;font-family:'Cinzel',serif;position:relative;z-index:1}
.back-link:hover{color:var(--emerald)}

/* Hero */
.hero{position:relative;text-align:center;padding:64px 20px 48px;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 0%,#0a2a14 0%,transparent 70%)}
.hero-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.06}
.hero-bg span{position:absolute;font-size:80px;font-weight:900;color:#fff;animation:drift 20s linear infinite;font-family:'Noto Sans JP',sans-serif}
@keyframes drift{0%{transform:translateY(120%) rotate(0deg)}100%{transform:translateY(-120%) rotate(15deg)}}
.eyebrow{display:inline-block;font-family:'Cinzel',serif;font-size:11px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:var(--emerald);border:1px solid #50c87855;padding:4px 14px;border-radius:20px;margin-bottom:20px}
h1{font-size:clamp(28px,5vw,54px);font-weight:600;line-height:1.1;margin-bottom:12px;font-family:'Cormorant Garamond',serif;background:linear-gradient(135deg,#fff 20%,#80e8a0 60%,#50c878 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:13px;color:#7aaa8a;max-width:480px;margin:0 auto 12px;line-height:1.8}

/* Page */
.page{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 20px 100px}

/* Divider */
.divider{display:flex;align-items:center;gap:12px;margin:36px 0 18px}
.divider::before{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--green3))}
.divider::after{content:'';flex:1;height:1px;background:linear-gradient(270deg,transparent,var(--green3))}
.divider span{font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:var(--emerald);text-transform:uppercase;white-space:nowrap;background:var(--bg2);padding:4px 14px;border:1px solid var(--green3);border-radius:20px}

/* Action button */
.btn-main{width:100%;padding:14px 10px;font-size:13px;font-weight:700;border:1px solid var(--green);border-radius:10px;background:linear-gradient(135deg,var(--bg3),var(--bg2));color:var(--emerald);cursor:pointer;font-family:'Noto Sans JP',sans-serif;letter-spacing:.5px;transition:all .22s;position:relative;overflow:hidden}
.btn-main::before{content:'';position:absolute;inset:0;background:var(--green);opacity:0;transition:opacity .22s}
.btn-main:hover::before{opacity:.12}
.btn-main:hover{border-color:var(--emerald);box-shadow:0 0 20px var(--green)44;transform:translateY(-2px)}

/* Slider rows */
.item-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;background:var(--bg2);border:1px solid var(--dim);padding:12px 14px;border-radius:10px;transition:border-color .2s}
.item-row:hover{border-color:var(--heat,var(--green3))}
.item-left{display:flex;flex-direction:column;gap:3px;width:160px;flex-shrink:0}
.item-label{font-size:12px;color:var(--text);opacity:.85;line-height:1.4}
.item-sublabel{font-size:10px;color:var(--muted);line-height:1.3}
.item-slider{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(to right,var(--heat,#50c878) 0%,var(--heat,#50c878) var(--pct,50%),var(--dim) var(--pct,50%),var(--dim) 100%)}
.item-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:var(--heat,#50c878);cursor:pointer;box-shadow:0 0 10px var(--heat,#50c878)99;border:2px solid var(--bg)}
.item-slider::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--heat,#50c878);cursor:pointer;border:2px solid var(--bg)}
.item-val-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:52px}
.item-value{font-size:18px;font-weight:700;color:var(--heat,#50c878);font-family:'Cinzel',serif;line-height:1;transition:color .3s}
.item-word{font-size:9px;color:var(--heat,#50c878);letter-spacing:.5px;margin-top:2px;text-align:center;white-space:nowrap;opacity:.8;transition:color .3s}
.roll-small{padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:1px;background:transparent;border:1px solid var(--dim);border-radius:6px;color:var(--muted);cursor:pointer;flex-shrink:0;transition:all .18s;font-family:'Cinzel',serif}
.roll-small:hover{border-color:var(--green);color:var(--emerald)}

/* Result cards */
.result-cards{display:flex;flex-direction:column;gap:8px}
.result-card{background:var(--bg2);border:1px solid var(--dim);border-radius:10px;overflow:hidden;transition:border-color .3s}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--dim)}
.card-header-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--emerald);text-transform:uppercase}
.card-header-val{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--heat,#50c878)}
.card-body{padding:12px 16px;font-size:13px;color:var(--text);line-height:1.85;opacity:.9}
.card-level{font-size:11px;font-weight:700;color:var(--heat,#50c878);font-family:'Cinzel',serif;letter-spacing:1px;margin-bottom:5px;display:block}

/* Summary / AI */
.summary-box{background:var(--bg2);border:1px solid var(--dim);border-radius:14px;padding:24px;margin-top:8px;position:relative;overflow:hidden}
.summary-box::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 40% at 50% 0%,var(--green3)22,transparent 70%);pointer-events:none}
.summary-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--emerald);text-transform:uppercase;text-align:center;margin-bottom:16px}
.summary-narration{background:var(--bg3);border:1px solid var(--green3);border-radius:8px;padding:14px 16px;font-size:16px;line-height:2;color:var(--text);margin-bottom:14px;min-height:56px;font-style:italic;font-family:'Cormorant Garamond',serif}
.summary-textarea{width:100%;height:220px;padding:12px;font-size:12px;background:var(--bg3);border:1px solid var(--dim);border-radius:8px;color:var(--text);resize:vertical;line-height:1.9;font-family:'Noto Sans JP',sans-serif}
.copy-btn{width:100%;margin-top:12px;padding:13px;font-size:13px;font-weight:700;letter-spacing:1px;background:transparent;border:1px solid var(--green);border-radius:10px;color:var(--emerald);cursor:pointer;font-family:'Cinzel',serif;text-transform:uppercase;transition:all .22s}
.copy-btn:hover{background:var(--green3);box-shadow:0 0 20px var(--green)44}

/* Footer */
.site-footer{text-align:center;padding:32px 20px;border-top:1px solid var(--dim);color:var(--muted);font-size:11px;line-height:2.2;margin-top:20px}
.site-footer a{font-family:'Cinzel',serif;font-size:13px;letter-spacing:3px;background:linear-gradient(90deg,#9F2E42,#50c878);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;display:block;margin-bottom:6px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="v-line"></div>

<a class="back-link" href="index.html">← Arluna AI Atelier</a>

<div class="hero">
  <div style="height:1px;background:linear-gradient(90deg,transparent,#9F2E42,#50c878,#9F2E42,transparent);opacity:.5"></div>
  <div class="hero-bg">
    <span style="left:5%;animation-delay:0s;animation-duration:25s">性</span>
    <span style="left:20%;animation-delay:4s;animation-duration:18s">格</span>
    <span style="left:38%;animation-delay:8s;animation-duration:22s">心</span>
    <span style="left:55%;animation-delay:2s;animation-duration:28s">魂</span>
    <span style="left:72%;animation-delay:11s;animation-duration:20s">思</span>
    <span style="left:88%;animation-delay:6s;animation-duration:24s">志</span>
  </div>
  <div class="eyebrow">Big Five Personality</div>
  <div style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:#3a6a4a;margin-bottom:8px">Arluna AI Atelier</div>
  <h1>ビッグファイブ<br>性格設定ツール</h1>
  <p class="hero-sub">心理学の「ビッグファイブ」理論をもとに<br>キャラクターの性格の輪郭をダイスで描く</p>
</div>

<div class="page">
  <div class="divider"><span>Actions</span></div>
  <button class="btn-main" onclick="rollAll()">🎲 全てまとめて決定</button>

  <div class="divider"><span>Result</span></div>
  <div class="summary-box">
    <div class="summary-title">Character Reading</div>
    <div id="narration" class="summary-narration">——</div>
    <textarea id="summary-text" class="summary-textarea" readonly></textarea>
    <button class="copy-btn" onclick="copySummary()">Copy to Clipboard</button>
  </div>

  <div class="divider"><span>Big Five</span></div>
  <div id="sliders-area"></div>

  <div class="divider"><span>Details</span></div>
  <div id="result-cards" class="result-cards"></div>

  <div class="site-footer">
    <a href="index.html">AAA — Arluna AI Atelier</a>
    AIと遊びながらつくったツール集
  </div>
</div>

<script>
const TRAITS=[
  {id:'t1',label:'新しいことへの興味',sub:'好奇心・想像力・開放性',
   levels:['超・保守的','やや保守的','普通','好奇心旺盛','超・革新的'],
   texts:[
    'ルーティンと伝統を絶対とし、変化を好まない。既知の世界に安心感を見出す。',
    'いつものやり方を好み、急な変化には戸惑う。慣れた環境で力を発揮するタイプ。',
    '基本はいつものやり方だが、必要なら新しいことも柔軟に受け入れられる。',
    '新しいアイデアや未知の場所へ行くのが大好き。好奇心が行動の原動力になっている。',
    '常に新しい刺激と変化を求める。誰もやっていない斬新なことへ次々と挑戦していく。'
  ]},
  {id:'t2',label:'まじめさ',sub:'計画性・自制心・誠実さ',
   levels:['超・大ざっぱ','臨機応変型','普通','計画的','完璧主義'],
   texts:[
    '計画は立てず、気分とノリで動く。整理整頓は苦手で、衝動に従いやすい。',
    '少し忘れっぽくサボり癖もあるが、急な予定変更には強く柔軟に対応できる。',
    'やるべきことはこなすが、ときに息抜きでサボることもある。バランス型。',
    'ルールと約束をしっかり守り、立てた計画をテキパキと実行する。信頼されやすい。',
    '一度決めた計画は必ずやり遂げる超コツコツ型。妥協を一切許さない完璧主義者。'
  ]},
  {id:'t3',label:'人付き合いの好きさ',sub:'外向性・社交性・活動性',
   levels:['超・内向的','少人数派','普通','おしゃべり','超・外向的'],
   texts:[
    '一人の時間を何より愛する。人と話すことは大きなエネルギーを消耗する行為。',
    '大人数は苦手だが、少人数の親しい人と静かに過ごすのは楽しめる。',
    '人とワイワイする時間も一人の時間も、どちらも同じくらい必要なバランス型。',
    '人と話すのが好きで、自分からどんどん話しかける。明るく社交的な存在。',
    '常に誰かと一緒にいたい。目立つことが大好きで、自然と場の中心になる。'
  ]},
  {id:'t4',label:'まわりへの優しさ',sub:'協調性・思いやり・信頼性',
   levels:['超・ドライ','理屈優先','普通','思いやりがある','超・自己犠牲的'],
   texts:[
    '他人の感情は気にしない。自分の意見をはっきりと、時に冷酷なほど押し通す。',
    '人に合わせるより事実と理屈を優先する。クールでサバサバとした性格。',
    '基本的には人に優しくするが、言うべきときは自分の意見もしっかり主張できる。',
    '困っている人をよく助け、争いを避けてみんなと平和に過ごすことを好む。',
    '自分のことより他人を優先してしまう。人に合わせすぎて自分を犠牲にしがち。'
  ]},
  {id:'t5',label:'気分の変わりやすさ',sub:'神経症的傾向・繊細さ・不安定さ',
   levels:['鋼のメンタル','落ち着いている','普通','プレッシャーに弱い','超・繊細'],
   texts:[
    'どんな大ピンチでも全く動じない。心がどっしりとしていて常に冷静を保つ。',
    'ちょっとやそっとのトラブルでは取り乱さない。ストレスに強く安定している。',
    '普通に落ち込んだり不安になることもあるが、しばらくすれば自分で立ち直れる。',
    '不安を感じやすく緊張しやすい。一方で周囲の危険や変化にいち早く気づける。',
    'ちょっとしたことで激しく落ち込んだりパニックになることがある。心がとても敏感。'
  ]},
];

function toWord(v){
  if(v<=10)return"皆無";if(v<=25)return"極めて低";if(v<=40)return"低め";
  if(v<=55)return"平均";if(v<=70)return"やや高";if(v<=85)return"高め";
  if(v<=95)return"非常に高";return"極限";
}
function heatColor(v){
  if(v<=20)return'#4a90e0';if(v<=35)return'#5aaad0';if(v<=50)return'#50c878';
  if(v<=65)return'#a0cc40';if(v<=80)return'#e8a020';if(v<=92)return'#e05540';
  return'#cc2a2a';
}
function getLevel(v){
  if(v<=20)return 0;if(v<=40)return 1;if(v<=60)return 2;if(v<=80)return 3;return 4;
}

// スライダー描画
function buildSliders(){
  const area=document.getElementById('sliders-area');
  TRAITS.forEach(tr=>{
    const row=document.createElement('div');
    row.className='item-row';
    row.id='row-'+tr.id;
    row.innerHTML=`
      <div class="item-left">
        <div class="item-label">${tr.label}</div>
        <div class="item-sublabel">${tr.sub}</div>
      </div>
      <input type="range" class="item-slider" id="sld-${tr.id}" min="1" max="100" value="50" oninput="updateVal('${tr.id}')">
      <div class="item-val-wrap">
        <div class="item-value" id="val-${tr.id}">50</div>
        <div class="item-word" id="word-${tr.id}">平均</div>
      </div>
      <button class="roll-small" onclick="rollOne('${tr.id}')">再振</button>
    `;
    area.appendChild(row);
    applyHeat(tr.id,50);
  });
}

function applyHeat(id,val){
  const col=heatColor(val);
  const row=document.getElementById('row-'+id);
  const sld=document.getElementById('sld-'+id);
  if(!row||!sld)return;
  row.style.setProperty('--heat',col);
  sld.style.setProperty('--heat',col);
  sld.style.setProperty('--pct',val+'%');
}

function updateVal(id){
  const val=+document.getElementById('sld-'+id).value;
  document.getElementById('val-'+id).textContent=val;
  document.getElementById('word-'+id).textContent=toWord(val);
  applyHeat(id,val);
  updateCards();
  buildNarration();
  buildSummaryText();
}

function rollOne(id){
  const val=Math.floor(Math.random()*100)+1;
  document.getElementById('sld-'+id).value=val;
  updateVal(id);
}

function rollAll(){
  TRAITS.forEach(tr=>rollOne(tr.id));
}

// 詳細カード更新
function updateCards(){
  const area=document.getElementById('result-cards');
  area.innerHTML='';
  TRAITS.forEach(tr=>{
    const val=+document.getElementById('sld-'+tr.id).value;
    const lv=getLevel(val);
    const col=heatColor(val);
    const card=document.createElement('div');
    card.className='result-card';
    card.style.setProperty('--heat',col);
    card.style.borderColor=col+'44';
    card.innerHTML=`
      <div class="card-header" style="border-bottom-color:${col}33">
        <div class="card-header-title">${tr.label}</div>
        <div class="card-header-val" style="color:${col}">${val} — ${tr.levels[lv]}</div>
      </div>
      <div class="card-body">
        <span class="card-level" style="color:${col}">[ ${tr.levels[lv]} ]</span>
        ${tr.texts[lv]}
      </div>
    `;
    area.appendChild(card);
  });
}

// テキストまとめ
function buildSummaryText(){
  let txt='【ビッグファイブ 性格設定】\n\n';
  TRAITS.forEach(tr=>{
    const val=+document.getElementById('sld-'+tr.id).value;
    const lv=getLevel(val);
    txt+=`■ ${tr.label}（${tr.sub}）\n`;
    txt+=`  数値: ${val}　評価: ${tr.levels[lv]}\n`;
    txt+=`  ${tr.texts[lv]}\n\n`;
  });
  document.getElementById('summary-text').value=txt.trim();
}

// ナレーション生成
function buildNarration(){
  const vals={};
  TRAITS.forEach(tr=>{vals[tr.id]=+document.getElementById('sld-'+tr.id).value;});
  const [t1,t2,t3,t4,t5]=[vals.t1,vals.t2,vals.t3,vals.t4,vals.t5];
  const lv1=getLevel(t1),lv2=getLevel(t2),lv3=getLevel(t3),lv4=getLevel(t4),lv5=getLevel(t5);

  let lines=[];

  // 外向性×開放性
  if(lv3>=3&&lv1>=3) lines.push('新しいことを求めて外へ出ていく——好奇心と社交性が合わさった、行動的な探求者の気質がある。');
  else if(lv3<=1&&lv1>=3) lines.push('内なる世界で豊かに思索する。外には出ないが、想像力は誰よりも広大だ。');
  else if(lv3>=3&&lv1<=1) lines.push('人と集まることは好きだが、保守的で変化は好まない。安心できる仲間との時間を何より大切にする。');
  else if(lv3<=1&&lv1<=1) lines.push('静かに、いつも通りに生きることを好む。波乱を嫌い、深い安定の中に居場所を見出す。');

  // 誠実性×神経症傾向
  if(lv2>=3&&lv5<=1) lines.push('計画を立て、ぶれずに実行する。鋼のメンタルと自制心が、どんな困難も乗り越えさせる。');
  else if(lv2>=3&&lv5>=3) lines.push('完璧を目指す気持ちは強いが、不安やプレッシャーとも常に戦っている。その緊張感が行動力の源でもある。');
  else if(lv2<=1&&lv5>=3) lines.push('計画は苦手で、不安にも揺れやすい。しかしその繊細さが、他人には見えないものを感じ取る力につながっている。');

  // 協調性
  if(lv4>=4) lines.push('他者への思いやりが非常に強く、自分を犠牲にしてでも人を助けようとする。その優しさは美しいが、消耗しやすい面もある。');
  else if(lv4<=0) lines.push('他者への配慮より自分の意見と論理を優先する。それは時に冷酷に映るが、揺るがない強さでもある。');

  // デフォルト
  if(lines.length===0) lines.push('突出した特徴を持たず、バランスの取れた性格の持ち主。状況に応じて柔軟に振る舞える、安定した人物だ。');

  document.getElementById('narration').textContent=lines.join('　');
}

function copySummary(){
  const ta=document.getElementById('summary-text');
  ta.select();
  navigator.clipboard?.writeText(ta.value).catch(()=>{document.execCommand('copy')});
  const btn=document.querySelector('.copy-btn');
  btn.textContent='Copied ✓';
  setTimeout(()=>{btn.textContent='Copy to Clipboard';},2000);
}

buildSliders();
updateCards();
buildNarration();
buildSummaryText();
