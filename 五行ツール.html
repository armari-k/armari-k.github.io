<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五行ツール — Arluna AI Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Noto+Sans+JP:wght@300;400;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080f0a;--bg2:#0d1a10;--bg3:#112216;
  --green:#2d7a4f;--green2:#3fa068;--green3:#1a4d30;
  --emerald:#50c878;--gold:#c9a96e;--gold2:#e8d5a3;
  --dim:#1a3020;--muted:#5a8068;--text:#ddeee4;--light:#f0faf4;
  /* 五行カラー */
  --col-wood:#4aaa3a;
  --col-fire:#e05030;
  --col-earth:#c8a020;
  --col-metal:#a0b0c0;
  --col-water:#4080d0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;overflow-x:hidden;font-weight:300}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.03;pointer-events:none;z-index:0}

.blob{position:fixed;border-radius:50%;filter:blur(140px);opacity:.13;pointer-events:none;z-index:0;animation:blobDrift 22s ease-in-out infinite alternate}
.blob1{width:600px;height:500px;background:#2d7a4f;top:-150px;right:-150px;animation-duration:24s}
.blob2{width:400px;height:400px;background:#1a4d30;bottom:-100px;left:-100px;animation-duration:30s;animation-delay:-12s}
.blob3{width:280px;height:280px;background:#c9a96e;top:50%;left:40%;opacity:.05;animation-duration:18s;animation-delay:-6s}
@keyframes blobDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,20px) scale(1.05)}}
.v-line{position:fixed;left:36px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--green3) 30%,var(--green3) 70%,transparent);opacity:.4;z-index:0}
@media(max-width:600px){.v-line{display:none}}

.back-link{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:2px;color:#3a6a4a;text-decoration:none;padding:8px 16px 0;transition:color .2s;font-family:'Cinzel',serif;position:relative;z-index:1}
.back-link:hover{color:var(--emerald)}

.hero{position:relative;text-align:center;padding:64px 20px 48px;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 0%,#0a2a14 0%,transparent 70%)}
.hero-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.06}
.hero-bg span{position:absolute;font-size:80px;font-weight:900;color:#fff;animation:drift 20s linear infinite;font-family:'Noto Sans JP',sans-serif}
@keyframes drift{0%{transform:translateY(120%) rotate(0deg)}100%{transform:translateY(-120%) rotate(15deg)}}
.eyebrow{display:inline-block;font-family:'Cinzel',serif;font-size:11px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:var(--emerald);border:1px solid #50c87855;padding:4px 14px;border-radius:20px;margin-bottom:20px}
h1{font-size:clamp(28px,5vw,54px);font-weight:600;line-height:1.1;margin-bottom:12px;font-family:'Cormorant Garamond',serif;background:linear-gradient(135deg,#fff 20%,#80e8a0 60%,#50c878 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:13px;color:#7aaa8a;max-width:480px;margin:0 auto 12px;line-height:1.8}

.page{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 20px 100px}

.divider{display:flex;align-items:center;gap:12px;margin:36px 0 18px}
.divider::before{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--green3))}
.divider::after{content:'';flex:1;height:1px;background:linear-gradient(270deg,transparent,var(--green3))}
.divider span{font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:var(--emerald);text-transform:uppercase;white-space:nowrap;background:var(--bg2);padding:4px 14px;border:1px solid var(--green3);border-radius:20px}

.btn-main{width:100%;padding:14px 10px;font-size:13px;font-weight:700;border:1px solid var(--green);border-radius:10px;background:linear-gradient(135deg,var(--bg3),var(--bg2));color:var(--emerald);cursor:pointer;font-family:'Noto Sans JP',sans-serif;letter-spacing:.5px;transition:all .22s;position:relative;overflow:hidden}
.btn-main::before{content:'';position:absolute;inset:0;background:var(--green);opacity:0;transition:opacity .22s}
.btn-main:hover::before{opacity:.12}
.btn-main:hover{border-color:var(--emerald);box-shadow:0 0 20px var(--green)44;transform:translateY(-2px)}

/* スライダー行 */
.item-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;background:var(--bg2);border:1px solid var(--dim);padding:12px 14px;border-radius:10px;transition:border-color .2s}
.item-row:hover{border-color:var(--elem-col,var(--green3))}
.item-left{display:flex;flex-direction:column;gap:3px;width:148px;flex-shrink:0}
.item-label{font-size:13px;font-weight:700;color:var(--elem-col,var(--text));line-height:1.4;transition:color .2s}
.item-sublabel{font-size:10px;color:var(--muted);line-height:1.3}
.item-slider{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(to right,var(--elem-col,#50c878) 0%,var(--elem-col,#50c878) var(--pct,50%),var(--dim) var(--pct,50%),var(--dim) 100%)}
.item-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:var(--elem-col,#50c878);cursor:pointer;box-shadow:0 0 10px var(--elem-col,#50c878)99;border:2px solid var(--bg)}
.item-slider::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--elem-col,#50c878);cursor:pointer;border:2px solid var(--bg)}
.item-val-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:44px}
.item-value{font-size:18px;font-weight:700;font-family:'Cinzel',serif;line-height:1;color:var(--elem-col,#50c878);transition:color .2s}
.roll-small{padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:1px;background:transparent;border:1px solid var(--dim);border-radius:6px;color:var(--muted);cursor:pointer;flex-shrink:0;transition:all .18s;font-family:'Cinzel',serif}
.roll-small:hover{border-color:var(--green);color:var(--emerald)}

/* 五角形チャート */
.penta-wrap{display:flex;justify-content:center;padding:10px 0}
.penta-wrap svg{max-width:320px;width:100%}

/* ランキングカード */
.rank-cards{display:flex;flex-direction:column;gap:8px}
.rank-card{background:var(--bg2);border-radius:10px;overflow:hidden;transition:border-color .3s}
.rank-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.rank-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#fff;opacity:.7}
.rank-title{font-family:'Cinzel',serif;font-size:14px;font-weight:600;color:#fff}
.rank-score{font-family:'Cinzel',serif;font-size:13px;color:#fff;opacity:.8}
.rank-body{padding:14px 16px}
.rank-desc{font-size:13px;color:var(--text);line-height:1.85;margin-bottom:10px;opacity:.9}
.rank-modern{background:var(--bg3);border-left:3px solid;padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:8px}
.rank-fantasy{font-size:11px;color:var(--muted);opacity:.7;font-style:italic}

/* サマリーボックス */
.summary-box{background:var(--bg2);border:1px solid var(--dim);border-radius:14px;padding:24px;margin-top:8px;position:relative;overflow:hidden}
.summary-box::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 40% at 50% 0%,var(--green3)22,transparent 70%);pointer-events:none}
.summary-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--emerald);text-transform:uppercase;text-align:center;margin-bottom:16px}
.summary-narration{background:var(--bg3);border:1px solid var(--green3);border-radius:8px;padding:14px 16px;font-size:16px;line-height:2;color:var(--text);margin-bottom:14px;font-style:italic;font-family:'Cormorant Garamond',serif;min-height:52px}
.summary-textarea{width:100%;height:200px;padding:12px;font-size:12px;background:var(--bg3);border:1px solid var(--dim);border-radius:8px;color:var(--text);resize:vertical;line-height:1.9;font-family:'Noto Sans JP',sans-serif}
.copy-btn{width:100%;margin-top:12px;padding:13px;font-size:13px;font-weight:700;letter-spacing:1px;background:transparent;border:1px solid var(--green);border-radius:10px;color:var(--emerald);cursor:pointer;font-family:'Cinzel',serif;text-transform:uppercase;transition:all .22s}
.copy-btn:hover{background:var(--green3);box-shadow:0 0 20px var(--green)44}

.site-footer{text-align:center;padding:32px 20px;border-top:1px solid var(--dim);color:var(--muted);font-size:11px;line-height:2.2;margin-top:20px}
.site-footer a{font-family:'Cinzel',serif;font-size:13px;letter-spacing:3px;background:linear-gradient(90deg,#9F2E42,#50c878);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;display:block;margin-bottom:6px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="v-line"></div>

<a class="back-link" href="index.html">← Arluna AI Atelier</a>

<div class="hero">
  <div style="height:1px;background:linear-gradient(90deg,transparent,#9F2E42,#50c878,#9F2E42,transparent);opacity:.5"></div>
  <div class="hero-bg">
    <span style="left:5%;animation-delay:0s;animation-duration:25s">木</span>
    <span style="left:20%;animation-delay:4s;animation-duration:18s">火</span>
    <span style="left:38%;animation-delay:8s;animation-duration:22s">土</span>
    <span style="left:55%;animation-delay:2s;animation-duration:28s">金</span>
    <span style="left:72%;animation-delay:11s;animation-duration:20s">水</span>
    <span style="left:88%;animation-delay:6s;animation-duration:24s">気</span>
  </div>
  <div class="eyebrow">Five Elements Balance</div>
  <div style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:#3a6a4a;margin-bottom:8px">Arluna AI Atelier</div>
  <h1>五行<br>オーラバランスツール</h1>
  <p class="hero-sub">木・火・土・金・水——5つのエネルギーの強さが<br>キャラクターの雰囲気と立ち位置を決める</p>
</div>

<div class="page">

  <div class="divider"><span>Actions</span></div>
  <button class="btn-main" onclick="rollAll()">🎲 全てまとめて決定</button>

  <div class="divider"><span>Result</span></div>
  <div class="summary-box">
    <div class="summary-title">Aura Reading</div>
    <div id="narration-badge" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px"></div>
  <div id="narration" class="summary-narration">——</div>
    <textarea id="summary-text" class="summary-textarea" readonly></textarea>
    <button class="copy-btn" onclick="copySummary()">Copy to Clipboard</button>
  </div>

  <div class="divider"><span>Pentagon Chart</span></div>
  <div class="penta-wrap" id="penta-wrap"></div>

  <div class="divider"><span>Five Elements</span></div>
  <div id="sliders-area"></div>

  <div class="divider"><span>Ranking</span></div>
  <div id="rank-cards" class="rank-cards"></div>

  <div class="site-footer">
    <a href="index.html">AAA — Arluna AI Atelier</a>
    AIと遊びながらつくったツール集
  </div>
</div>

<script>
const ELEMS=[
  {id:'wood', icon:'🌲', label:'木', sub:'のびのび・成長・自由',
   col:'#4aaa3a',
   desc:'木が空へ伸びるように、向上心がありマイペース。束縛を嫌い、新しいことに挑戦するのが好きで自由を愛する。',
   modern:'フットワークの軽いベンチャーの若手、流行に敏感なフリーランス、好奇心旺盛な学生',
   fantasy:'森のエルフ、風使い、旅人'},
  {id:'fire', icon:'🔥', label:'火', sub:'情熱・直感・熱量',
   col:'#e05030',
   desc:'燃え上がる炎のように明るく情熱的で直感で動く。周りを巻き込む強いパワーがあるが、熱しやすく冷めやすい一面も。',
   modern:'ノリが良く熱血な営業マン、飲み会のムードメーカー、感情がすぐ顔に出る素直な後輩',
   fantasy:'炎の魔法使い、突撃する勇者、太陽の申し子'},
  {id:'earth',icon:'⛰️', label:'土', sub:'安定・包容力・縁の下',
   col:'#c8a020',
   desc:'大地のようにどっしり落ち着いていて、面倒見が良い。急な変化は苦手だが、とても頼りになり、人を育てるのが得意。',
   modern:'みんなのお母さん的なベテラン事務員、悩みを聞いてくれる頼れる先輩・教師',
   fantasy:'頑強なドワーフ、大地の守護者、農耕の神'},
  {id:'metal',icon:'⚔️', label:'金', sub:'白黒・鋭さ・完璧主義',
   col:'#a0b0c0',
   desc:'硬い金属のように論理的で無駄を嫌い、白黒はっきりつける性格。クールで鋭いが、完璧主義で少し近寄りがたいことも。',
   modern:'感情に流されないクールな経理担当、隙のない敏腕弁護士、無口で職人気質なエンジニア',
   fantasy:'冷徹な剣士、規律を重んじる騎士、銀の魔法使い'},
  {id:'water',icon:'💧', label:'水', sub:'柔軟・知性・ミステリアス',
   col:'#4080d0',
   desc:'形を変える水のようにどんな状況にもスルリと合わせる柔軟性がある。知的でミステリアスだが、本心が読めないことも。',
   modern:'飄々とした掴みどころのない芸術家、何を考えているか分からない天才、夜の街のバーテンダー',
   fantasy:'謎めいた占い師、水の精霊、深海の賢者'},
];

// 五角形の頂点順序（木→火→土→金→水で相生サイクル順）
// 木=上、火=右上、土=右下、金=左下、水=左上
const PENTA_ORDER=['wood','fire','earth','metal','water'];

function getVal(id){return +document.getElementById('sld-'+id).value;}
function setVal(id,v){
  const sld=document.getElementById('sld-'+id);
  sld.value=v;
  sld.style.setProperty('--pct',v+'%');
  document.getElementById('val-'+id).textContent=v;
}

// スライダー描画
function buildSliders(){
  const area=document.getElementById('sliders-area');
  ELEMS.forEach(el=>{
    const row=document.createElement('div');
    row.className='item-row';
    row.style.setProperty('--elem-col',el.col);
    row.id='row-'+el.id;
    row.innerHTML=`
      <div class="item-left">
        <div class="item-label" style="color:${el.col}">${el.icon} ${el.label}</div>
        <div class="item-sublabel">${el.sub}</div>
      </div>
      <input type="range" class="item-slider" id="sld-${el.id}"
        min="1" max="100" value="50" style="--elem-col:${el.col};--pct:50%"
        oninput="onInput('${el.id}')">
      <div class="item-val-wrap">
        <div class="item-value" id="val-${el.id}" style="color:${el.col}">50</div>
      </div>
      <button class="roll-small" onclick="rollOne('${el.id}')">再振</button>
    `;
    area.appendChild(row);
  });
}

function onInput(id){
  const v=getVal(id);
  const sld=document.getElementById('sld-'+id);
  sld.style.setProperty('--pct',v+'%');
  document.getElementById('val-'+id).textContent=v;
  update();
}

function rollOne(id){
  const v=Math.floor(Math.random()*100)+1;
  setVal(id,v);
  update();
}

function rollAll(){
  ELEMS.forEach(el=>setVal(el.id,Math.floor(Math.random()*100)+1));
  update();
}

// 五角形チャート描画
function drawPenta(){
  const W=320,H=320,cx=160,cy=160,R=110;
  const n=5;
  const vals=PENTA_ORDER.map(id=>getVal(id));
  const cols=PENTA_ORDER.map(id=>ELEMS.find(e=>e.id===id).col);
  const icons=PENTA_ORDER.map(id=>ELEMS.find(e=>e.id===id).icon);
  const labels=PENTA_ORDER.map(id=>ELEMS.find(e=>e.id===id).label);

  function pt(i,r){
    const a=i/n*Math.PI*2-Math.PI/2;
    return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};
  }

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  // グリッド五角形（20,40,60,80,100）
  [20,40,60,80,100].forEach(pct=>{
    const r=R*pct/100;
    const pts=Array.from({length:n},(_,i)=>pt(i,r));
    const d=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join('')+'Z';
    svg+=`<path d="${d}" fill="none" stroke="#1a3020" stroke-width="${pct===100?1.5:1}" stroke-dasharray="${pct===100?'none':'3,3'}"/>`;
  });
  // 軸線
  Array.from({length:n},(_,i)=>{
    const p=pt(i,R);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#1a3020" stroke-width="1"/>`;
  });

  // データ五角形
  const dataPts=vals.map((v,i)=>pt(i,R*v/100));
  const dd=dataPts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join('')+'Z';

  // 各要素色のグラデーション感を出すために半透明重ね
  PENTA_ORDER.forEach((id,i)=>{
    const col=cols[i];
    const p1=dataPts[i];
    const p2=dataPts[(i+1)%n];
    svg+=`<path d="M${cx},${cy} L${p1.x.toFixed(1)},${p1.y.toFixed(1)} L${p2.x.toFixed(1)},${p2.y.toFixed(1)} Z" fill="${col}" fill-opacity="0.18"/>`;
  });
  // アウトライン
  svg+=`<path d="${dd}" fill="none" stroke="#50c878" stroke-width="1.5" stroke-opacity="0.6"/>`;

  // 頂点ドット
  dataPts.forEach((p,i)=>{
    svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${cols[i]}" stroke="var(--bg,#080f0a)" stroke-width="2"/>`;
  });

  // ラベル（アイコン＋漢字＋数値）
  Array.from({length:n},(_,i)=>{
    const p=pt(i,R+26);
    const v=vals[i];
    svg+=`<text x="${p.x.toFixed(1)}" y="${(p.y-6).toFixed(1)}" text-anchor="middle" dominant-baseline="middle"
      font-family="sans-serif" font-size="16" fill="${cols[i]}">${icons[i]}</text>`;
    svg+=`<text x="${p.x.toFixed(1)}" y="${(p.y+10).toFixed(1)}" text-anchor="middle" dominant-baseline="middle"
      font-family="'Cinzel',serif" font-size="11" font-weight="700" fill="${cols[i]}">${labels[i]}</text>`;
    svg+=`<text x="${p.x.toFixed(1)}" y="${(p.y+24).toFixed(1)}" text-anchor="middle" dominant-baseline="middle"
      font-family="'Cinzel',serif" font-size="10" fill="${cols[i]}" opacity="0.75">${v}</text>`;
  });

  svg+=`<circle cx="${cx}" cy="${cy}" r="3" fill="#50c87844"/>`;
  svg+='</svg>';
  document.getElementById('penta-wrap').innerHTML=svg;
}

// ランキングカード
function drawRanking(){
  const sorted=[...ELEMS].sort((a,b)=>getVal(b.id)-getVal(a.id));
  const rankLabels=['1位 — 主オーラ','2位 — 副オーラ','3位','4位','5位 — 最も薄い'];
  const opacities=[1,.85,.7,.55,.45];
  document.getElementById('rank-cards').innerHTML=sorted.map((el,i)=>`
    <div class="rank-card" style="border:1px solid ${el.col}${i===0?'':'44'};opacity:${opacities[i]}">
      <div class="rank-header" style="background:${el.col}${i===0?'dd':'55'}">
        <div>
          <div class="rank-label">${rankLabels[i]}</div>
          <div class="rank-title">${el.icon} ${el.label}（${el.sub}）</div>
        </div>
        <div class="rank-score">${getVal(el.id)}点</div>
      </div>
      <div class="rank-body">
        <div class="rank-desc">${el.desc}</div>
        <div class="rank-modern" style="border-color:${el.col}">
          <span style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:${el.col};display:block;margin-bottom:4px">MODERN EXAMPLE</span>
          ${el.modern}
        </div>
        <div class="rank-fantasy">⚔️ ファンタジー例：${el.fantasy}</div>
      </div>
    </div>
  `).join('');
}

// ナレーション
function buildNarration(){
  const sorted=[...ELEMS].sort((a,b)=>getVal(b.id)-getVal(a.id));
  const top=sorted[0],sec=sorted[1],bot=sorted[4];
  let lines=[];

  // 主オーラ別
  const mainLines={
    wood:'自由と成長を求めて常に前へ進む。枝が広がるように可能性を広げ、誰も踏み込まない道を切り拓いていく。',
    fire:'情熱が全ての源。直感と熱量で周囲を巻き込み、炎のように場を照らす——ただし、燃え尽きる前に誰かが水を差すかもしれない。',
    earth:'揺るぎない安定と包容力で、まわりを支え続ける大地のような存在。急がず、焦らず、しかし確実に根を張る。',
    metal:'論理と完璧への追求が行動の全て。切れ味鋭い判断で無駄をそぎ落とし、己の信念に従い孤高を保つ。',
    water:'掴みどころのない柔軟さと深い知性が武器。相手の形に合わせながら、静かに深いところへ流れていく。',
  };
  // バッジ表示（上部）
  const badge=document.getElementById('narration-badge');
  if(badge){
    badge.innerHTML=sorted.map((el,i)=>{
      const opacity=[1,.85,.7,.45,.3][i];
      const label=['主','副','','','最弱'][i];
      return `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;background:${el.col}${i===0?'33':'18'};border:1px solid ${el.col}${i===0?'99':'44'};font-family:'Cinzel',serif;font-size:11px;color:${el.col};opacity:${opacity};white-space:nowrap">
        ${label?`<span style="font-size:9px;letter-spacing:1px;opacity:.7">${label}</span>`:''}
        ${el.icon} ${el.label}
        <span style="font-size:10px;opacity:.7">${getVal(el.id)}</span>
      </span>`;
    }).join('');
  }
  lines.push(mainLines[top.id]);

  // 2位との組み合わせ
  const combo=`${top.id}-${sec.id}`;
  const comboLines={
    'wood-fire':'情熱（火）が成長（木）の燃料となり、行動力と向上心が高い次元で融合している。',
    'wood-water':'知性（水）が自由（木）の方向性を定め、感性と論理が共存する深みのある人物。',
    'fire-wood':'木の上昇志向が火の情熱をさらに燃え上がらせる。止まらない突破力の持ち主。',
    'fire-earth':'情熱の中に安定感があり、周囲を巻き込みながらも頼れるリーダーとなる。',
    'earth-metal':'安定（土）と鋭さ（金）が合わさり、包容力の中に芯の通った厳格さが宿る。',
    'earth-water':'大らかさと柔軟性が融合。誰にでも合わせながら、静かな知恵で場をまとめる。',
    'metal-earth':'完璧主義に包容力が加わり、厳しいが面倒見の良い、信頼される存在となる。',
    'metal-water':'論理と直感の両輪。冷静な分析力と深い洞察が組み合わさった、恐ろしいほど有能な人物。',
    'water-metal':'知性に鋭さが加わり、静かだが誰よりも鋭い観察眼を持つ。ミステリアスな切れ者。',
    'water-wood':'柔軟な知性が成長の方向を見出し、静かに、しかし確実に自分の道を切り拓く。',
  };
  if(comboLines[combo]) lines.push(comboLines[combo]);

  // 最弱オーラ
  const weakLines={
    wood:'自由や変化にはあまり執着しない。安定した環境の中に留まることを好む一面がある。',
    fire:'熱しやすい感情表現や衝動的な行動とは距離がある。冷静さと計算が持ち味。',
    earth:'どっしり構えることよりも、動き続けることに生き甲斐を感じるタイプ。',
    metal:'白黒つけることよりも、曖昧さや感情を大切にする。完璧主義とは縁遠い。',
    water:'ミステリアスさや柔軟な変化より、はっきりとした自己表現を好む。',
  };
  lines.push(`一方、${bot.icon}${bot.label}のオーラは最も薄く——${weakLines[bot.id]}`);

  document.getElementById('narration').textContent=lines.join('　');
}

// テキストまとめ
function buildSummaryText(){
  const sorted=[...ELEMS].sort((a,b)=>getVal(b.id)-getVal(a.id));
  let txt='【五行オーラバランス】\n\n';
  sorted.forEach((el,i)=>{
    txt+=`${i+1}位 ${el.icon}${el.label}（${el.sub}）: ${getVal(el.id)}点\n`;
    txt+=`  ${el.desc}\n\n`;
  });
  document.getElementById('summary-text').value=txt.trim();
}

function copySummary(){
  const ta=document.getElementById('summary-text');
  ta.select();
  navigator.clipboard?.writeText(ta.value).catch(()=>document.execCommand('copy'));
  const btn=document.querySelector('.copy-btn');
  btn.textContent='Copied ✓';
  setTimeout(()=>{btn.textContent='Copy to Clipboard';},2000);
}

function update(){
  drawPenta();
  drawRanking();
  buildNarration();
  buildSummaryText();
}

buildSliders();
update();
</script>
